<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Events | CodeChef ABES</title>

    <link rel="stylesheet"
          href="css/style.css">
</head>

<body>

    <!-- Navigation -->

    <nav class="navbar">

        <a class="logo" href="index.html">
            CodeChef <span>ABES</span>
        </a>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a class="active" href="events.html">
                Events
            </a>

            <a href="admin.html">
                Admin
            </a>

        </div>

    </nav>


    <main class="page">

        <!-- Page Header -->

        <section class="page-header">

            <p class="eyebrow">
                CodeChef ABES
            </p>

            <h1>
                All Events
            </h1>

            <p>
                Find contests, workshops and tech events
                happening around campus.
            </p>

        </section>


        <!-- Search and Filter -->

        <section class="filters">

            <input
                id="search"
                type="search"
                placeholder="Search events by name...">


            <select id="category">

                <option value="all">
                    All Categories
                </option>

                <option value="Competitive Programming">
                    Competitive Programming
                </option>

                <option value="Web Development">
                    Web Development
                </option>

                <option value="Hackathon">
                    Hackathon
                </option>

                <option value="Workshop">
                    Workshop
                </option>

            </select>

        </section>


        <!-- Events will appear here -->

        <div
            id="events-list"
            class="event-grid">
        </div>

    </main>


    <footer>
        © 2026 CodeChef ABES Chapter
    </footer>


    <!-- JavaScript -->

    <script src="js/app.js"></script>
    <script src="js/events.js"></script>

</body>

</html>
